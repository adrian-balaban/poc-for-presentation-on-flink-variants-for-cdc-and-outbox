apply plugin: 'jacoco'
apply plugin: 'info.solidsoft.pitest'

test {
    useJUnitPlatform()
}

dependencies {
    compileOnly libs.flink.streaming.java
    implementation libs.flink.connector.kafka
    implementation libs.flink.connector.base
    implementation libs.kafka.clients
    implementation libs.flink.sql.connector.mysql.cdc
    implementation libs.mysql.connector.j
    implementation libs.json
    testImplementation libs.flink.streaming.java
    testImplementation libs.flink.clients
    testImplementation libs.slf4j.simple
    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testImplementation libs.lombok
    testAnnotationProcessor libs.lombok
}

jacocoTestReport {
    dependsOn test
    reports { xml.required = true; html.required = true }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            element = 'CLASS'
            // Deserializer has no logic; KafkaSinkFactory.create is pure Flink API wiring
            // OutboxRouter is tested end-to-end in component tests (requires flink-connector-base at runtime)
            excludes = [
                'poc.common.deserializer.PocJsonDeserializationSchema',
                'poc.common.router.OutboxRouter',
                'poc.common.sink.KafkaSinkFactory'
            ]
            limit { counter = 'LINE';   value = 'COVEREDRATIO'; minimum = 1.0 }
            limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = 1.0 }
        }
    }
}
check.dependsOn jacocoTestCoverageVerification

pitest {
    junit5PluginVersion = libs.versions.pitestJunit5.get()
    targetClasses       = ['poc.common.config.*', 'poc.common.sink.KafkaSinkFactory']
    targetTests         = ['poc.common.*']
    excludedClasses     = ['poc.common.deserializer.*']
    excludedMethods     = ['create']
    mutationThreshold   = 100
    coverageThreshold   = 0
    outputFormats       = ['HTML', 'XML']
    timestampedReports  = false
}
