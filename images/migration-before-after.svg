<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Kafka Connect @ Scale: Migration Pattern</text>

  <!-- BEFORE Section -->
  <g id="before">
    <!-- Box -->
    <rect x="50" y="80" width="450" height="350" fill="#fff5f5" stroke="#ff6b6b" stroke-width="2" rx="8"/>
    <text x="275" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#c92a2a">BEFORE: Shared Blast Radius</text>

    <!-- Tribes -->
    <circle cx="100" cy="200" r="35" fill="#4c6ef5" opacity="0.8"/>
    <text x="100" y="210" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Tribe A</text>

    <circle cx="200" cy="180" r="35" fill="#4c6ef5" opacity="0.8"/>
    <text x="200" y="190" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Tribe B</text>

    <circle cx="300" cy="210" r="35" fill="#4c6ef5" opacity="0.8"/>
    <text x="300" y="220" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Tribe C</text>

    <text x="380" y="200" font-size="14" fill="#666">... 26 teams</text>

    <!-- Central Cluster -->
    <rect x="80" y="300" width="350" height="90" fill="#ff8c8c" stroke="#c92a2a" stroke-width="2" rx="6"/>
    <text x="255" y="325" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Kafka Connect (Shared)</text>
    <text x="255" y="345" font-size="12" text-anchor="middle" fill="white">95 connectors, 1 cluster</text>
    <text x="255" y="363" font-size="11" text-anchor="middle" fill="white">One rebalance = all fail</text>

    <!-- Arrows -->
    <path d="M 120 235 L 160 305" stroke="#ff6b6b" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>
    <path d="M 200 215 L 220 305" stroke="#ff6b6b" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>
    <path d="M 300 245 L 280 305" stroke="#ff6b6b" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>
  </g>

  <!-- Arrow between -->
  <text x="600" y="260" font-size="16" font-weight="bold" text-anchor="middle" fill="#666">→ MIGRATION →</text>

  <!-- AFTER Section -->
  <g id="after">
    <!-- Box -->
    <rect x="700" y="80" width="450" height="350" fill="#f0fdf4" stroke="#51cf66" stroke-width="2" rx="8"/>
    <text x="925" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#2b8a3e">AFTER: Isolated per Tribe</text>

    <!-- Tribe A Flink Job -->
    <rect x="720" y="170" width="90" height="60" fill="#51cf66" stroke="#2b8a3e" stroke-width="2" rx="4"/>
    <text x="765" y="190" font-size="11" text-anchor="middle" fill="white" font-weight="bold">Flink Job</text>
    <text x="765" y="205" font-size="10" text-anchor="middle" fill="white">Tribe A</text>
    <text x="765" y="218" font-size="9" text-anchor="middle" fill="white">5900-5999</text>

    <!-- Tribe B Flink Job -->
    <rect x="820" y="150" width="90" height="60" fill="#51cf66" stroke="#2b8a3e" stroke-width="2" rx="4"/>
    <text x="865" y="170" font-size="11" text-anchor="middle" fill="white" font-weight="bold">Flink Job</text>
    <text x="865" y="185" font-size="10" text-anchor="middle" fill="white">Tribe B</text>
    <text x="865" y="198" font-size="9" text-anchor="middle" fill="white">6000-6099</text>

    <!-- More tribes -->
    <rect x="920" y="170" width="90" height="60" fill="#51cf66" stroke="#2b8a3e" stroke-width="2" rx="4"/>
    <text x="965" y="190" font-size="11" text-anchor="middle" fill="white" font-weight="bold">Flink Job</text>
    <text x="965" y="205" font-size="10" text-anchor="middle" fill="white">Tribe C</text>
    <text x="965" y="218" font-size="9" text-anchor="middle" fill="white">6100-6199</text>

    <text x="1060" y="200" font-size="14" fill="#666">... 74 jobs</text>

    <!-- Remaining KC -->
    <rect x="720" y="270" width="290" height="70" fill="#ffd43b" stroke="#f59f00" stroke-width="2" rx="4"/>
    <text x="865" y="295" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Kafka Connect (Remaining)</text>
    <text x="865" y="312" font-size="10" text-anchor="middle" fill="#333">21 SFTP + SingleStore connectors</text>
    <text x="865" y="328" font-size="9" text-anchor="middle" fill="#666">(No Flink equivalent)</text>

    <!-- Arrows down -->
    <path d="M 765 230 L 850 270" stroke="#51cf66" stroke-width="2" fill="none"/>
    <path d="M 865 210 L 865 270" stroke="#51cf66" stroke-width="2" fill="none"/>
    <path d="M 965 230 L 880 270" stroke="#51cf66" stroke-width="2" fill="none"/>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(50, 450)">
    <circle cx="0" cy="0" r="5" fill="#ff6b6b"/>
    <text x="15" y="5" font-size="12" fill="#333">Shared blast radius</text>

    <circle cx="200" cy="0" r="5" fill="#51cf66"/>
    <text x="215" y="5" font-size="12" fill="#333">Isolated per tribe</text>
  </g>

  <!-- Arrow Markers -->
  <defs>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff6b6b"/>
    </marker>
  </defs>
</svg>
