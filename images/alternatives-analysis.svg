    <text x="150" y="460" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Criterion</text>

    <rect x="250" y="440" width="120" height="30" fill="#f1f3f5" stroke="#868e96" stroke-width="1"/>
    <text x="310" y="460" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Status Quo</text>

    <rect x="370" y="440" width="120" height="30" fill="#f1f3f5" stroke="#868e96" stroke-width="1"/>
    <text x="430" y="460" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Self-KC</text>

    <rect x="490" y="440" width="120" height="30" fill="#f1f3f5" stroke="#868e96" stroke-width="1"/>
    <text x="550" y="460" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Per-Tribe KC</text>

    <rect x="610" y="440" width="120" height="30" fill="#f1f3f5" stroke="#868e96" stroke-width="1"/>
    <text x="670" y="460" font-size="9" font-weight="bold" text-anchor="middle" fill="#333">Flink Java Fork</text>

    <rect x="730" y="440" width="130" height="30" fill="#e6ffed" stroke="#51cf66" stroke-width="2"/>
    <text x="795" y="460" font-size="9" font-weight="bold" text-anchor="middle" fill="#2b8a3e">Flink Shared-Job</text>

    <!-- Row 1: Blast Radius -->
    <rect x="50" y="470" width="200" height="25" fill="#f8f9fa" stroke="#868e96" stroke-width="1"/>
    <text x="150" y="487" font-size="9" text-anchor="middle" fill="#333">Blast Radius</text>

    <rect x="250" y="470" width="120" height="25" fill="#ffe0e0" stroke="#868e96" stroke-width="1"/>
    <text x="310" y="487" font-size="9" text-anchor="middle" fill="#c92a2a">Shared</text>

    <rect x="370" y="470" width="120" height="25" fill="#ffe0e0" stroke="#868e96" stroke-width="1"/>
    <text x="430" y="487" font-size="9" text-anchor="middle" fill="#c92a2a">Shared</text>

    <rect x="490" y="470" width="120" height="25" fill="#e6ffed" stroke="#868e96" stroke-width="1"/>
    <text x="550" y="487" font-size="9" text-anchor="middle" fill="#2b8a3e">Isolated</text>

    <rect x="610" y="470" width="120" height="25" fill="#e6ffed" stroke="#868e96" stroke-width="1"/>
    <text x="670" y="487" font-size="9" text-anchor="middle" fill="#2b8a3e">Isolated</text>

    <rect x="730" y="470" width="130" height="25" fill="#e6ffed" stroke="#51cf66" stroke-width="2"/>
    <text x="795" y="487" font-size="9" text-anchor="middle" fill="#2b8a3e">Isolated</text>

    <!-- Row 2: Licensing -->
    <rect x="50" y="495" width="200" height="25" fill="#f8f9fa" stroke="#868e96" stroke-width="1"/>
    <text x="150" y="512" font-size="9" text-anchor="middle" fill="#333">Licensing Cost</text>

    <rect x="250" y="495" width="120" height="25" fill="#ffe0e0" stroke="#868e96" stroke-width="1"/>
    <text x="310" y="512" font-size="9" text-anchor="middle" fill="#c92a2a">High</text>

    <rect x="370" y="495" width="120" height="25" fill="#e6ffed" stroke="#868e96" stroke-width="1"/>
    <text x="430" y="512" font-size="9" text-anchor="middle" fill="#2b8a3e">None</text>

    <rect x="490" y="495" width="120" height="25" fill="#ffe0e0" stroke="#868e96" stroke-width="1"/>
    <text x="550" y="512" font-size="9" text-anchor="middle" fill="#c92a2a">High × 26</text>

    <rect x="610" y="495" width="120" height="25" fill="#e6ffed" stroke="#868e96" stroke-width="1"/>
    <text x="670" y="512" font-size="9" text-anchor="middle" fill="#2b8a3e">None</text>

    <rect x="730" y="495" width="130" height="25" fill="#e6ffed" stroke="#51cf66" stroke-width="2"/>
    <text x="795" y="512" font-size="9" text-anchor="middle" fill="#2b8a3e">None</text>

    <!-- Row 3: Per-Tribe Java -->
    <rect x="50" y="520" width="200" height="25" fill="#f8f9fa" stroke="#868e96" stroke-width="1"/>
    <text x="150" y="537" font-size="9" text-anchor="middle" fill="#333">Per-Tribe Java</text>

    <rect x="250" y="520" width="120" height="25" fill="#f1f3f5" stroke="#868e96" stroke-width="1"/>
    <text x="310" y="537" font-size="9" text-anchor="middle" fill="#666">N/A</text>

    <rect x="370" y="520" width="120" height="25" fill="#f1f3f5" stroke="#868e96" stroke-width="1"/>
    <text x="430" y="537" font-size="9" text-anchor="middle" fill="#666">N/A</text>

    <rect x="490" y="520" width="120" height="25" fill="#f1f3f5" stroke="#868e96" stroke-width="1"/>
    <text x="550" y="537" font-size="9" text-anchor="middle" fill="#666">N/A</text>

    <rect x="610" y="520" width="120" height="25" fill="#ffe0e0" stroke="#868e96" stroke-width="1"/>
    <text x="670" y="537" font-size="9" text-anchor="middle" fill="#c92a2a">26× repos</text>

    <rect x="730" y="520" width="130" height="25" fill="#e6ffed" stroke="#51cf66" stroke-width="2"/>
    <text x="795" y="537" font-size="9" text-anchor="middle" fill="#2b8a3e">None</text>

    <!-- Row 4: Operational Burden -->
    <rect x="50" y="545" width="200" height="25" fill="#f8f9fa" stroke="#868e96" stroke-width="1"/>
    <text x="150" y="562" font-size="9" text-anchor="middle" fill="#333">Ops Burden</text>

    <rect x="250" y="545" width="120" height="25" fill="#e6ffed" stroke="#868e96" stroke-width="1"/>
    <text x="310" y="562" font-size="9" text-anchor="middle" fill="#2b8a3e">Low</text>

    <rect x="370" y="545" width="120" height="25" fill="#ffd43b" stroke="#868e96" stroke-width="1"/>
    <text x="430" y="562" font-size="9" text-anchor="middle" fill="#d9480f">Medium</text>

    <rect x="490" y="545" width="120" height="25" fill="#ffe0e0" stroke="#868e96" stroke-width="1"/>
    <text x="550" y="562" font-size="9" text-anchor="middle" fill="#c92a2a">High × 26</text>

    <rect x="610" y="545" width="120" height="25" fill="#ffd43b" stroke="#868e96" stroke-width="1"/>
    <text x="670" y="562" font-size="9" text-anchor="middle" fill="#d9480f">Medium × 26</text>

    <rect x="730" y="545" width="130" height="25" fill="#e6ffed" stroke="#51cf66" stroke-width="2"/>
    <text x="795" y="562" font-size="9" text-anchor="middle" fill="#2b8a3e">Low</text>

    <!-- Row 5: CDC Suitability -->
    <rect x="50" y="570" width="200" height="25" fill="#f8f9fa" stroke="#868e96" stroke-width="1"/>
    <text x="150" y="587" font-size="9" text-anchor="middle" fill="#333">CDC Suitability</text>

    <rect x="250" y="570" width="120" height="25" fill="#e6ffed" stroke="#868e96" stroke-width="1"/>
    <text x="310" y="587" font-size="9" text-anchor="middle" fill="#2b8a3e">Good</text>

    <rect x="370" y="570" width="120" height="25" fill="#e6ffed" stroke="#868e96" stroke-width="1"/>
    <text x="430" y="587" font-size="9" text-anchor="middle" fill="#2b8a3e">Good</text>

    <rect x="490" y="570" width="120" height="25" fill="#e6ffed" stroke="#868e96" stroke-width="1"/>
    <text x="550" y="587" font-size="9" text-anchor="middle" fill="#2b8a3e">Good</text>

    <rect x="610" y="570" width="120" height="25" fill="#e6ffed" stroke="#868e96" stroke-width="1"/>
    <text x="670" y="587" font-size="9" text-anchor="middle" fill="#2b8a3e">Excellent</text>

    <rect x="730" y="570" width="130" height="25" fill="#e6ffed" stroke="#51cf66" stroke-width="2"/>
    <text x="795" y="587" font-size="9" text-anchor="middle" fill="#2b8a3e">Excellent</text>
  </g>

  <!-- Recommendation -->
  <g id="recommendation" transform="translate(50, 620)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#2b8a3e">✓ RECOMMENDATION: Flink CDC Shared-Job Model</text>
    <text x="0" y="20" font-size="10" fill="#333">Removes blast radius AND licensing cost. Platform Team owns one base image.</text>
    <text x="0" y="35" font-size="10" fill="#333">Each tribe overrides via Helm only — no per-tribe Java, no release pipeline friction.</text>
    <text x="0" y="50" font-size="10" fill="#333">Lowest-friction path to the same guarantees that Option 3 (per-tribe KC) achieves at 26× cost.</text>
  </g>

  <!-- Markers -->
  <defs>
    <marker id="arrowgray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
