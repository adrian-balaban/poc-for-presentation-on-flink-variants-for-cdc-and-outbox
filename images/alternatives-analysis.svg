<svg viewBox="0 0 1400 750" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="700" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Alternatives Considered: Why Flink CDC Shared-Job Model?</text>

  <!-- Legend -->
  <g id="legend" transform="translate(1050, 50)">
    <circle cx="0" cy="0" r="6" fill="#ff6b6b"/>
    <text x="15" y="5" font-size="10" fill="#333">Not chosen</text>

    <circle cx="120" cy="0" r="6" fill="#51cf66"/>
    <text x="135" y="5" font-size="10" fill="#333">Chosen</text>
  </g>

  <!-- Option 1: Status Quo -->
  <g id="option1">
    <rect x="50" y="100" width="250" height="280" fill="#ffe0e0" stroke="#ff6b6b" stroke-width="2" rx="8"/>

    <text x="175" y="125" font-size="12" font-weight="bold" text-anchor="middle" fill="#c92a2a">Option 1</text>
    <text x="175" y="142" font-size="11" font-weight="bold" text-anchor="middle" fill="#c92a2a">Stay on Confluent</text>
    <text x="175" y="158" font-size="11" font-weight="bold" text-anchor="middle" fill="#c92a2a">Kafka Cloud</text>

    <rect x="65" y="170" width="220" height="1" fill="#ff6b6b"/>

    <text x="65" y="190" font-size="9" fill="#333">✓ Managed service</text>
    <text x="65" y="205" font-size="9" fill="#333">✓ No ops burden</text>
    <text x="65" y="220" font-size="9" fill="#333">✓ Support included</text>

    <text x="65" y="245" font-size="9" fill="#c92a2a">✗ Licensing cost</text>
    <text x="65" y="260" font-size="9" fill="#c92a2a">✗ Shared blast radius</text>
    <text x="65" y="275" font-size="9" fill="#c92a2a">✗ No per-tribe lever</text>
    <text x="65" y="290" font-size="9" fill="#c92a2a">✗ Rebalance storms</text>
    <text x="65" y="305" font-size="9" fill="#c92a2a">✗ Pain remains</text>

    <circle cx="175" cy="340" r="8" fill="#ff6b6b"/>
  </g>

  <!-- Option 2: Self-managed KC -->
  <g id="option2">
    <rect x="325" y="100" width="250" height="280" fill="#ffe0e0" stroke="#ff6b6b" stroke-width="2" rx="8"/>

    <text x="450" y="125" font-size="12" font-weight="bold" text-anchor="middle" fill="#c92a2a">Option 2</text>
    <text x="450" y="142" font-size="11" font-weight="bold" text-anchor="middle" fill="#c92a2a">Self-Managed</text>
    <text x="450" y="158" font-size="11" font-weight="bold" text-anchor="middle" fill="#c92a2a">Kafka Connect</text>

    <rect x="340" y="170" width="220" height="1" fill="#ff6b6b"/>

    <text x="340" y="190" font-size="9" fill="#333">✓ Drops license cost</text>
    <text x="340" y="205" font-size="9" fill="#333">✓ Self-controlled</text>

    <text x="340" y="230" font-size="9" fill="#c92a2a">✗ Shared blast radius</text>
    <text x="340" y="245" font-size="9" fill="#c92a2a">✗ Adds ops burden</text>
    <text x="340" y="260" font-size="9" fill="#c92a2a">✗ No per-tribe lever</text>
    <text x="340" y="275" font-size="9" fill="#c92a2a">✗ Rebalance still</text>
    <text x="340" y="290" font-size="9" fill="#c92a2a">✗ Pain remains</text>
    <text x="340" y="305" font-size="9" fill="#c92a2a">✗ 26 teams depend</text>

    <circle cx="450" cy="340" r="8" fill="#ff6b6b"/>
  </g>

  <!-- Option 3: Per-tribe KC clusters -->
  <g id="option3">
    <rect x="600" y="100" width="250" height="280" fill="#ffe0e0" stroke="#ff6b6b" stroke-width="2" rx="8"/>

    <text x="725" y="125" font-size="12" font-weight="bold" text-anchor="middle" fill="#c92a2a">Option 3</text>
    <text x="725" y="142" font-size="11" font-weight="bold" text-anchor="middle" fill="#c92a2a">Per-Tribe Dedicated</text>
    <text x="725" y="158" font-size="11" font-weight="bold" text-anchor="middle" fill="#c92a2a">KC Clusters</text>

    <rect x="615" y="170" width="220" height="1" fill="#ff6b6b"/>

    <text x="615" y="190" font-size="9" fill="#333">✓ True isolation</text>
    <text x="615" y="205" font-size="9" fill="#333">✓ Ownership clear</text>

    <text x="615" y="230" font-size="9" fill="#c92a2a">✗ Cost × 26 tribes</text>
    <text x="615" y="245" font-size="9" fill="#c92a2a">✗ Ops burden × 26</text>
    <text x="615" y="260" font-size="9" fill="#c92a2a">✗ KC not ideal</text>
    <text x="615" y="275" font-size="9" fill="#c92a2a">✗ for CDC at scale</text>
    <text x="615" y="290" font-size="9" fill="#c92a2a">✗ Over-engineered</text>
    <text x="615" y="305" font-size="9" fill="#c92a2a">✗ Licensing still</text>

    <circle cx="725" cy="340" r="8" fill="#ff6b6b"/>
  </g>

  <!-- Option 4: Flink CDC per-tribe Java fork -->
  <g id="option4">
    <rect x="875" y="100" width="250" height="280" fill="#ffe0e0" stroke="#ff6b6b" stroke-width="2" rx="8"/>

    <text x="1000" y="125" font-size="12" font-weight="bold" text-anchor="middle" fill="#c92a2a">Option 4</text>
    <text x="1000" y="142" font-size="11" font-weight="bold" text-anchor="middle" fill="#c92a2a">Flink CDC</text>
    <text x="1000" y="158" font-size="11" font-weight="bold" text-anchor="middle" fill="#c92a2a">Per-Tribe Java Fork</text>

    <rect x="890" y="170" width="220" height="1" fill="#ff6b6b"/>

    <text x="890" y="190" font-size="9" fill="#333">✓ True isolation</text>
    <text x="890" y="205" font-size="9" fill="#333">✓ Flink scalability</text>
    <text x="890" y="220" font-size="9" fill="#333">✓ No license cost</text>

    <text x="890" y="245" font-size="9" fill="#c92a2a">✗ Every tribe owns</text>
    <text x="890" y="260" font-size="9" fill="#c92a2a">  Java code + build</text>
    <text x="890" y="275" font-size="9" fill="#c92a2a">✗ 26 release pipelines</text>
    <text x="890" y="290" font-size="9" fill="#c92a2a">✗ Code duplication</text>
    <text x="890" y="305" font-size="9" fill="#c92a2a">✗ Hard to upgrade</text>

    <circle cx="1000" cy="340" r="8" fill="#ff6b6b"/>
  </g>

  <!-- Option 5: Chosen -->
  <g id="option5">
    <rect x="1150" y="100" width="250" height="280" fill="#e6ffed" stroke="#51cf66" stroke-width="3" rx="8"/>

    <text x="1275" y="125" font-size="13" font-weight="bold" text-anchor="middle" fill="#2b8a3e">✓ Option 5 (Chosen)</text>
    <text x="1275" y="142" font-size="11" font-weight="bold" text-anchor="middle" fill="#2b8a3e">Flink CDC</text>
    <text x="1275" y="158" font-size="11" font-weight="bold" text-anchor="middle" fill="#2b8a3e">Shared-Job Model</text>

    <rect x="1165" y="170" width="220" height="1" fill="#51cf66"/>

    <text x="1165" y="190" font-size="9" fill="#2b8a3e">✓ True isolation</text>
    <text x="1165" y="205" font-size="9" fill="#2b8a3e">✓ No per-tribe Java</text>
    <text x="1165" y="220" font-size="9" fill="#2b8a3e">✓ No license cost</text>
    <text x="1165" y="235" font-size="9" fill="#2b8a3e">✓ 1 base image</text>
    <text x="1165" y="250" font-size="9" fill="#2b8a3e">✓ Helm-only overrides</text>
    <text x="1165" y="265" font-size="9" fill="#2b8a3e">✓ Platform Team owns</text>
    <text x="1165" y="280" font-size="9" fill="#2b8a3e">✓ Minimal per-tribe</text>
    <text x="1165" y="295" font-size="9" fill="#2b8a3e">  operational burden</text>

    <circle cx="1275" cy="340" r="9" fill="#51cf66" stroke="#2b8a3e" stroke-width="2"/>
  </g>

