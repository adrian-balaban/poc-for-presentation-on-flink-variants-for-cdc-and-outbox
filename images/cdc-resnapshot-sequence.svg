<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <!-- Background -->
  <rect width="760" height="320" fill="#ffffff"/>

  <!-- Participant boxes -->
  <rect x="20"  y="10" width="100" height="36" rx="4" fill="#e8f4f8" stroke="#4a90a4" stroke-width="1.5"/>
  <rect x="200" y="10" width="100" height="36" rx="4" fill="#e8f4f8" stroke="#4a90a4" stroke-width="1.5"/>
  <rect x="400" y="10" width="120" height="36" rx="4" fill="#e8f4f8" stroke="#4a90a4" stroke-width="1.5"/>
  <rect x="600" y="10" width="130" height="36" rx="4" fill="#e8f4f8" stroke="#4a90a4" stroke-width="1.5"/>

  <!-- Participant labels -->
  <text x="70"  y="33" text-anchor="middle" font-weight="600" fill="#1a5276">Operator</text>
  <text x="250" y="33" text-anchor="middle" font-weight="600" fill="#1a5276">ArgoCD</text>
  <text x="460" y="33" text-anchor="middle" font-weight="600" fill="#1a5276">Flink CDC Job</text>
  <text x="665" y="33" text-anchor="middle" font-weight="600" fill="#1a5276">MySQL binlog</text>

  <!-- Lifelines -->
  <line x1="70"  y1="46" x2="70"  y2="300" stroke="#aac9d4" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="250" y1="46" x2="250" y2="300" stroke="#aac9d4" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="460" y1="46" x2="460" y2="300" stroke="#aac9d4" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="665" y1="46" x2="665" y2="300" stroke="#aac9d4" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Arrow 1: Op → ArgoCD -->
  <line x1="70" y1="100" x2="242" y2="100" stroke="#2471a3" stroke-width="1.5"/>
  <polygon points="242,95 252,100 242,105" fill="#2471a3"/>
  <text x="155" y="92" text-anchor="middle" font-size="11" fill="#333">upgradeMode: stateless + bump restartNonce</text>

  <!-- Arrow 2: ArgoCD → Flink -->
  <line x1="250" y1="150" x2="452" y2="150" stroke="#2471a3" stroke-width="1.5"/>
  <polygon points="452,145 462,150 452,155" fill="#2471a3"/>
  <text x="355" y="142" text-anchor="middle" font-size="11" fill="#333">delete checkpoint state + restart</text>

  <!-- Arrow 3: Flink → MySQL -->
  <line x1="460" y1="200" x2="657" y2="200" stroke="#2471a3" stroke-width="1.5"/>
  <polygon points="657,195 667,200 657,205" fill="#2471a3"/>
  <text x="562" y="192" text-anchor="middle" font-size="11" fill="#333">full initial snapshot (automatic)</text>

  <!-- Arrow 4: Op → ArgoCD -->
  <line x1="70" y1="255" x2="242" y2="255" stroke="#2471a3" stroke-width="1.5"/>
  <polygon points="242,250 252,255 242,260" fill="#2471a3"/>
  <text x="155" y="247" text-anchor="middle" font-size="11" fill="#333">revert upgradeMode: last-state</text>
</svg>
