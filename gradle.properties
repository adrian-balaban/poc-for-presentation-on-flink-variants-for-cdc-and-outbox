# Podman is the only supported container engine for './gradlew all'.
# podman-compose must be installed (pip install podman-compose).

# Run daemonless: './gradlew all allK8s' spawns nested './gradlew' execs that
# otherwise reuse stale IDLE daemons (which report shadowJar UP-TO-DATE after
# clean deleted the fat-jars -> NoSuchFileException) or get killed mid-build by
# an external --stop (e.g. the VS Code Gradle extension re-syncing on
# build.gradle edits). Daemonless invocation eliminates both failure modes.
# ./gradlew --stop alone is insufficient: it cannot reach orphaned daemons that
# lost their registry connection.
org.gradle.daemon=false
