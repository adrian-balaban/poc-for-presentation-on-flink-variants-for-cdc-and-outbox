# Variant 5 — YAML Pipeline (Flink CDC Pipeline API)
#
# Zero Java. Submitted via:
#   flink-cdc.sh pipeline.yaml
#
# Flink CDC 3.x handles snapshot + binlog automatically.
# Server-ID range 5700-5709 is reserved for this variant.

################################################################################
# Source — MySQL CDC
################################################################################
source:
  type: mysql
  name: MySQL Source
  hostname: ${MYSQL_HOST}
  port: ${MYSQL_PORT}
  username: ${MYSQL_USER}
  password: ${MYSQL_PASSWORD}
  tables: ${MYSQL_DATABASE}.orders
  server-id: 5700-5709
  server-time-zone: UTC
  # MySQL 8 uses caching_sha2_password; over a non-TLS connection the JDBC driver
  # used for schema discovery needs public-key retrieval enabled or it throws
  # "Public Key Retrieval is not allowed".
  jdbc.properties.allowPublicKeyRetrieval: "true"
  jdbc.properties.useSSL: "false"

################################################################################
# Sink — Kafka
################################################################################
sink:
  type: kafka
  name: Kafka Sink
  properties.bootstrap.servers: ${KAFKA_BOOTSTRAP}
  topic: ${KAFKA_TOPIC_PREFIX}.yaml-pipeline

################################################################################
# Pipeline metadata and checkpoint configuration
################################################################################
pipeline:
  name: Flink CDC YAML Pipeline CDC Job
  parallelism: 1
  schema.change.behavior: evolve
  # Checkpoint config must be FLAT dotted keys — the Flink CDC YAML parser flattens
  # the `pipeline:` block into a String→String map, so a nested `checkpoint:` object
  # throws "Cannot deserialize value of type String from Object value".
  # timeout must exceed the checkpoint interval; 60 s gives headroom under load.
  # WARNING: do NOT set upgradeMode: stateless in production Flink deployments —
  # it discards all CDC offset state on every restart, forcing a full re-snapshot.
  execution.checkpointing.interval: 30000
  execution.checkpointing.timeout: 60000
  execution.checkpointing.mode: EXACTLY_ONCE
  execution.checkpointing.max-concurrent-checkpoints: 1
  execution.checkpointing.min-pause: 5000
  execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
  # State backend and checkpoint storage with S3
  state.backend: rocksdb
  state.backend.rocksdb.localdir: /tmp/flink-rocksdb
  state.backend.rocksdb.memory.managed: "true"
  state.backend.rocksdb.memory.write-buffer-ratio: 0.5
  state.checkpoints.dir: s3://flink-checkpoints/yaml-pipeline-checkpoints
  state.savepoints.dir: s3://flink-checkpoints/yaml-pipeline-savepoints
  state.checkpoints.num-retained: 3
  state.checkpoints.incremental: "false"
  # S3/MinIO configuration for Presto filesystem
  s3.endpoint: http://minio:9000
  s3.path.style.access: "true"
  s3.access-key: minioadmin
  s3.secret-key: minioadmin
  # Presto S3 filesystem configuration
  fs.s3.endpoint: http://minio:9000
  fs.s3.path.style.access: true
