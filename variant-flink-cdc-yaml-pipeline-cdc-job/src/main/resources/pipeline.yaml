# Variant 5 — YAML Pipeline (Flink CDC Pipeline API)
#
# Zero Java. Submitted via:
#   flink-cdc.sh pipeline.yaml
#
# Flink CDC 3.x handles snapshot + binlog automatically.
# Server-ID range 5700-5709 is reserved for this variant.

################################################################################
# Source — MySQL CDC
################################################################################
source:
  type: mysql
  name: MySQL Source
  hostname: ${MYSQL_HOST}
  port: ${MYSQL_PORT}
  username: ${MYSQL_USER}
  password: ${MYSQL_PASSWORD}
  tables: ${MYSQL_DATABASE}.orders
  server-id: 5700-5709
  server-time-zone: UTC
  # MySQL 8 uses caching_sha2_password; over a non-TLS connection the JDBC driver
  # used for schema discovery needs public-key retrieval enabled or it throws
  # "Public Key Retrieval is not allowed".
  jdbc.properties.allowPublicKeyRetrieval: "true"
  jdbc.properties.useSSL: "false"

################################################################################
# Sink — Kafka
################################################################################
sink:
  type: kafka
  name: Kafka Sink
  properties.bootstrap.servers: ${KAFKA_BOOTSTRAP}
  topic: ${KAFKA_TOPIC_PREFIX}.yaml.flink.orders

################################################################################
# Pipeline metadata
################################################################################
pipeline:
  name: Flink CDC YAML Pipeline CDC Job
  parallelism: 1
  schema.change.behavior: evolve
  # NOTE: checkpoint/state config is intentionally NOT set here. The Flink CDC
  # Pipeline API ignores execution.checkpointing.* / state.* keys placed in this
  # pipeline: section — they do not propagate to the submitted job's execution
  # environment (verified: with them here the job's checkpointCfg is empty and
  # zero checkpoints complete). Checkpointing is enabled via flink-cdc.sh -D
  # flags in local-development/flink-cdc-submitter/entrypoint.sh (the documented
  # mechanism per `flink-cdc.sh --help`). The checkpoint dir is the shared
  # s3://flink-checkpoints/checkpoints, so this job writes checkpoints/<job-id>/
  # alongside the 4 Java variants (5 folders under checkpoints/ total).
