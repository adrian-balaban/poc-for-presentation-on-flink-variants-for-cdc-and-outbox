buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.github.johnrengelman:shadow:8.1.1'
        classpath 'info.solidsoft.gradle.pitest:gradle-pitest-plugin:1.15.0'
    }
}

// Shadow and pitest are applied per-subproject via apply plugin: '...'

ext {
    flinkVersion       = '2.2.0'
    flinkCdcVersion    = '3.6.0-2.2'
    flinkKafkaVersion  = '5.0.0-2.2'
    kafkaVersion       = '3.7.0'
    javaVersion        = '17'
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaVersion)
        targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaVersion)
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly "org.apache.flink:flink-streaming-java:${rootProject.ext.flinkVersion}"
        compileOnly "org.apache.flink:flink-clients:${rootProject.ext.flinkVersion}"
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    }

    test {
        useJUnitPlatform()
    }

    // Global resolution strategy for lz4-java conflict
    configurations.all {
        resolutionStrategy {
            force 'org.lz4:lz4-java:1.8.0'
            exclude group: 'at.yawk.lz4', module: 'lz4-java'
        }
    }
}

tasks.register('all') { // buildAndTest
    group = 'flink-cdc-poc'
    description = 'Build all, restart the container stack (Podman or Docker), and run component tests'

    doLast {
        // Detect the container engine — prefer Podman, fall back to Docker.
        boolean hasPodman = false
        try {
            hasPodman = ['bash', '-c', 'command -v podman-compose >/dev/null 2>&1'].execute().waitFor() == 0
        } catch (Exception ignored) { }

        String engine      = hasPodman ? 'podman' : 'docker'
        String composeUp   = hasPodman ? 'podman-compose -f podman-compose.yml up -d'   : 'docker compose up -d'
        String composeDown = hasPodman ? 'podman-compose -f podman-compose.yml down -v' : 'docker compose down -v --remove-orphans'
        println "=== Using container engine: ${engine} ==="

        // Build all modules
        exec {
            commandLine './gradlew', 'clean', 'build', '-x', 'test'
        }

        // Restart the container stack with improved diagnostics
        println "=== Stopping and cleaning ${engine} stack ==="
        exec {
            commandLine 'bash', '-c', "cd docker && ${composeDown}"
        }

        println '=== Waiting 5 seconds before restart ==='
        Thread.sleep(5000)

        println "=== Starting ${engine} stack ==="
        exec {
            commandLine 'bash', '-c', "cd docker && ${composeUp}"
        }

        // Wait for MySQL and Kafka to be ready (engine health status is
        // unreliable under podman-compose, so we probe the services directly).
        // Kafka Connect startup is handled by deploy-connectors.sh script.
        println 'Waiting for services to start (up to 90 seconds)...'
        int maxWait = 90
        int elapsed = 0
        boolean ready = false
        while (elapsed < maxWait) {
            try {
                def mysqlOk = "${engine} exec mysql mysqladmin ping -h localhost -u flink -pflink".execute().waitFor() == 0
                def kafkaOk = "${engine} exec kafka kafka-broker-api-versions --bootstrap-server localhost:9092".execute().waitFor() == 0
                if (mysqlOk && kafkaOk) {
                    println "✓ MySQL and Kafka are ready!"
                    ready = true
                    break
                }
            } catch (Exception e) {
                // Continue waiting, services might still be starting
            }
            elapsed += 5
            if (elapsed < maxWait && !ready) {
                println "Waiting... (${elapsed}s elapsed)"
                Thread.sleep(5000)
            }
        }

        if (!ready) {
            println "WARNING: Services may not be fully ready. Proceeding anyway..."
        }

        // Build Kafka Connect SMTs with Gradle
        println '=== Building Kafka Connect SMTs ==='
        exec {
            commandLine './gradlew', ':kafka-connect-smts:shadowJar'
        }

        // Deploy Kafka Connect connectors
        println '=== Deploying Kafka Connect connectors ==='
        exec {
            commandLine 'bash', '-c', 'cd docker/kafka-connect && ./deploy-connectors.sh'
        }

        // Run component tests (both Flink and Kafka Connect)
        println '=== Running component tests (Flink + Kafka Connect) ==='
        exec {
            commandLine './gradlew', ':component-tests:test'
        }
    }
}

