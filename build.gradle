buildscript {
    repositories {
        mavenCentral()
        maven { url = uri("https://plugins.gradle.org/m2") }
    }
    dependencies {
        classpath libs.shadow.gradle.plugin
        classpath libs.pitest.gradle.plugin
    }
}

plugins {
    alias(libs.plugins.spotless)
}

// Shadow and pitest are applied per-subproject via apply plugin: '...'

// Core stack versions are sourced from gradle/libs.versions.toml (single source of
// truth). The ext.* aliases are kept so existing `rootProject.ext.*` references in
// subprojects continue to resolve.
ext {
    flinkVersion       = libs.versions.flink.get()
    flinkCdcVersion    = libs.versions.flinkCdc.get()
    flinkKafkaVersion  = libs.versions.flinkKafka.get()
    kafkaVersion       = libs.versions.kafka.get()
    javaVersion        = libs.versions.java.get()
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'checkstyle'
    apply plugin: 'com.diffplug.spotless'

    java {
        sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaVersion)
        targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaVersion)
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly libs.flink.streaming.java
        compileOnly libs.flink.clients
        testImplementation libs.junit.jupiter
    }

    test {
        useJUnitPlatform()
    }

    checkstyle {
        toolVersion = libs.versions.checkstyle.get()
        ignoreFailures = false
        showViolations = true
    }

    spotless {
        java {
            target 'src/**/*.java', '**/test/**/*.java'
            googleJavaFormat(libs.versions.googleJavaFormat.get())
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    tasks.named('check').configure {
        dependsOn spotlessCheck
    }

    // Global resolution strategy for lz4-java conflict
    configurations.all {
        resolutionStrategy {
            force "org.lz4:lz4-java:${libs.versions.lz4.get()}"
            exclude group: 'at.yawk.lz4', module: 'lz4-java'
        }
    }
}

tasks.register('codeQuality') {
    group = 'analysis'
    description = 'Run Checkstyle code quality checks on all subprojects'
}

tasks.register('fmt') {
    group = 'formatting'
    description = 'Format all Java code with Spotless (Google Java Format)'
    dependsOn 'spotlessApply'
}

tasks.register('fmtCheck') {
    group = 'formatting'
    description = 'Check Java formatting without applying changes'
    dependsOn 'spotlessCheck'
}

// ── allK8s ───────────────────────────────────────────────────────────────────
// Deploys the full k8s stack (kind cluster, 5 Flink variants, 5 Kafka Connect
// variants, monitoring) via deploy.sh, then runs the component test suite against
// the k8s stack via kubectl port-forward.
//
// Prerequisites: kind, kubectl, helm, podman (all on PATH).
// Stop the Podman Compose stack before running this task to avoid port conflicts.
//
// Port-forward mapping used during tests (all on high ports — no Podman conflicts):
//   MySQL:                 localhost:13306  → svc/mysql
//   Kafka:                 localhost:19092  → svc/poc-kafka-kafka-external-bootstrap:9094
//     (the external nodeport listener — advertisedHostTemplate: localhost /
//     advertisedPortTemplate: 19092 — so a host-side KafkaConsumer can resolve
//     the broker the metadata handshake returns; the `plain` internal listener
//     advertises the in-cluster pod FQDN, unresolvable from the host)
//   DataStream JM REST:    localhost:18081  → svc/datastream-cdc-rest
//   Table API JM REST:     localhost:18082  → svc/table-api-cdc-rest
//   SQL API JM REST:       localhost:18083  → svc/sql-api-cdc-rest
//   Outbox JM REST:        localhost:18084  → svc/outbox-cdc-rest
//   YAML Pipeline JM REST: localhost:18085  → svc/yaml-pipeline-cdc-rest
//   Kafka Connect REST:    localhost:18086  → svc/poc-connect-connect-api
//
// Each Flink variant test class runs in a separate Gradle invocation with its own
// FLINK_REST_URL pointing to the variant's JM — every variant gets its own isolated
// test run against the correct cluster. KC tests share one invocation with
// KAFKA_CONNECT_URL=http://localhost:18086 and SCHEMA_HISTORY_KAFKA_BOOTSTRAP
// pointing to the in-cluster Kafka.
tasks.register('allK8s') {
    group = 'flink-cdc-poc'
    description = 'Deploy k8s stack (kind) via deploy.sh and run component tests via kubectl port-forward'

    doLast {
        // ── prerequisites ────────────────────────────────────────────────────
        ['kind', 'kubectl', 'helm', 'podman'].each { tool ->
            boolean found = false
            try { found = ['bash', '-c', "command -v ${tool} >/dev/null 2>&1"].execute().waitFor() == 0 }
            catch (Exception ignored) { }
            if (!found) throw new GradleException("'${tool}' not found on PATH — required for allK8s")
        }

        // ── deploy ───────────────────────────────────────────────────────────
        println '=== Running deploy.sh (kind cluster + 5 Flink + 5 KC + monitoring) ==='
        exec {
            commandLine 'bash', 'local-development-k8s/deploy.sh'
        }

        // ── port-forwards ────────────────────────────────────────────────────
        // One tunnel per variant REST service so each test class targets the right JM.
        // Killed in the finally block regardless of test outcome.
        println '=== Starting kubectl port-forwards ==='
        def portForwards = [
            ['kubectl', '-n', 'poc', 'port-forward', 'svc/mysql',                     '13306:3306'],
            ['kubectl', '-n', 'poc', 'port-forward', 'svc/poc-kafka-kafka-external-bootstrap', '19092:9094'],
            ['kubectl', '-n', 'poc', 'port-forward', 'svc/datastream-cdc-rest',        '18081:8081'],
            ['kubectl', '-n', 'poc', 'port-forward', 'svc/table-api-cdc-rest',         '18082:8081'],
            ['kubectl', '-n', 'poc', 'port-forward', 'svc/sql-api-cdc-rest',           '18083:8081'],
            ['kubectl', '-n', 'poc', 'port-forward', 'svc/outbox-cdc-rest',            '18084:8081'],
            ['kubectl', '-n', 'poc', 'port-forward', 'svc/yaml-pipeline-cdc-rest',     '18085:8081'],
            ['kubectl', '-n', 'poc', 'port-forward', 'svc/poc-connect-connect-api',    '18086:8083'],
        ].collect { it.execute() }

        println '=== Waiting 5 s for port-forwards to stabilise ==='
        Thread.sleep(5000)

        // Common env vars shared by all test invocations.
        def commonEnv = [
            MYSQL_PORT:        '13306',
            KAFKA_BOOTSTRAP:   'localhost:19092',
        ]

        // Per-variant Flink test runs — each targets its own JM via FLINK_REST_URL.
        // Running as separate Gradle invocations ensures FlinkRestClient.BASE_URL
        // (a static field read once per JVM at class-load) picks up the right URL.
        def flinkVariants = [
            [test: 'poc.component.DataStreamCdcTest',   url: 'http://localhost:18081'],
            [test: 'poc.component.TableApiCdcTest',     url: 'http://localhost:18082'],
            [test: 'poc.component.SqlApiCdcTest',       url: 'http://localhost:18083'],
            [test: 'poc.component.DataStreamOutboxTest',url: 'http://localhost:18084'],
            [test: 'poc.component.YamlPipelineCdcTest', url: 'http://localhost:18085'],
        ]

        try {
            flinkVariants.each { variant ->
                println "=== Flink test: ${variant.test} → ${variant.url} ==="
                exec {
                    commandLine './gradlew', ':component-tests:test', '--tests', variant.test
                    environment commonEnv
                    environment 'FLINK_REST_URL', variant.url
                }
            }

            println '=== Running Kafka Connect tests → http://localhost:18086 ==='
            exec {
                commandLine './gradlew', ':component-tests:test',
                    '--tests', 'poc.component.KafkaConnect*'
                environment commonEnv
                environment 'KAFKA_CONNECT_URL',           'http://localhost:18086'
                // Debezium connectors inside KC connect to Kafka via in-cluster address.
                environment 'SCHEMA_HISTORY_KAFKA_BOOTSTRAP', 'poc-kafka-kafka-bootstrap:9092'
            }
        } finally {
            println '=== Stopping kubectl port-forwards ==='
            portForwards*.destroy()
            portForwards*.waitFor()  // ensure ports are released before JVM exits
        }
    }
}

tasks.register('all') { // buildAndTest
    group = 'flink-cdc-poc'
    description = 'Build all, restart the container stack (Podman), and run component tests'
    dependsOn ':common:spotlessApply', spotlessCheck

    doLast {
        // Require podman-compose — no Docker fallback
        boolean hasPodman = false
        try {
            hasPodman = ['bash', '-c', 'command -v podman-compose >/dev/null 2>&1'].execute().waitFor() == 0
        } catch (Exception ignored) { }
        if (!hasPodman) {
            throw new GradleException(
                'podman-compose not found. Install it (e.g. sudo apt install podman-compose) before running ./gradlew all.')
        }

        String composeUp   = 'podman-compose -f podman-compose.yml up -d --build'
        // --remove-orphans: without it, containers that lost their compose-project label
        // (or were left from a partial run) survive `down -v`, so the subsequent `up --build`
        // fails with "creating container storage: the container name 'mysql' is already in use"
        // and the stack is not recreated fresh.
        String composeDown = 'podman-compose -f podman-compose.yml down --remove-orphans -v'
        println '=== Using container engine: podman ==='

        // Build all modules, including the variant fat-jars the component tests submit
        exec {
            commandLine './gradlew', 'clean', 'build', '-x', 'test', 'shadowJar'
        }

        // Restart the container stack with improved diagnostics
        println '=== Stopping and cleaning podman stack ==='
        exec {
            commandLine 'bash', '-c', "cd local-development-podman && ${composeDown}"
            ignoreExitValue = true  // "container not found" on first run is not an error
        }

        println '=== Waiting 5 seconds before restart ==='
        Thread.sleep(5000)

        println '=== Starting podman stack ==='
        exec {
            commandLine 'bash', '-c', "cd local-development-podman && ${composeUp}"
        }

        // Wait for MySQL, Kafka, Kafka Connect, Flink, Prometheus, and Grafana to be ready.
        // Engine health status is unreliable under podman-compose, so probe services directly.
        // 180s timeout: Kafka Connect plugin scanning + Debezium download on first build
        // can take 90s+, especially on cold starts.
        println 'Waiting for services to start (up to 180 seconds)...'
        int maxWait = 180
        int elapsed = 0
        boolean mysqlKafkaReady = false
        boolean kafkaConnectReady = false
        boolean flinkReady = false
        boolean prometheusReady = false
        boolean grafanaReady = false
        while (elapsed < maxWait) {
            try {
                if (!mysqlKafkaReady) {
                    mysqlKafkaReady = ['bash', '-c',
                        'podman exec mysql mysqladmin ping -h localhost -u flink -pflink 2>/dev/null && ' +
                        'podman exec kafka kafka-broker-api-versions --bootstrap-server localhost:9092 2>/dev/null']
                        .execute().waitFor() == 0
                    if (mysqlKafkaReady) println "✓ MySQL and Kafka are ready!"
                }
                if (!kafkaConnectReady) {
                    kafkaConnectReady = ['bash', '-c', 'curl -sf http://localhost:8083 >/dev/null 2>&1']
                        .execute().waitFor() == 0
                    if (kafkaConnectReady) println "✓ Kafka Connect is ready!"
                }
                if (!flinkReady) {
                    flinkReady = ['bash', '-c', 'curl -sf http://localhost:8081/overview >/dev/null 2>&1']
                        .execute().waitFor() == 0
                    if (flinkReady) println "✓ Flink JobManager is ready!"
                }
                if (!prometheusReady) {
                    prometheusReady = ['bash', '-c', 'curl -sf http://localhost:9090/-/healthy >/dev/null 2>&1']
                        .execute().waitFor() == 0
                    if (prometheusReady) println "✓ Prometheus is ready!"
                }
                if (!grafanaReady) {
                    grafanaReady = ['bash', '-c', 'curl -sf http://localhost:3001/api/health >/dev/null 2>&1']
                        .execute().waitFor() == 0
                    if (grafanaReady) println "✓ Grafana is ready!"
                }
                if (mysqlKafkaReady && kafkaConnectReady && flinkReady && prometheusReady && grafanaReady) break
            } catch (Exception e) {
                // Continue waiting, services might still be starting
            }
            elapsed += 5
            if (elapsed < maxWait) {
                println "Waiting... (${elapsed}s elapsed, MySQL+Kafka=${mysqlKafkaReady}, KC=${kafkaConnectReady}, Flink=${flinkReady}, Prometheus=${prometheusReady}, Grafana=${grafanaReady})"
                Thread.sleep(5000)
            }
        }

        if (!mysqlKafkaReady) println "WARNING: MySQL/Kafka may not be fully ready. Proceeding anyway..."
        if (!flinkReady) {
            def flinkContainerExists = ['bash', '-c',
                'podman inspect flink-jm >/dev/null 2>&1'].execute().waitFor() == 0
            if (!flinkContainerExists) {
                throw new GradleException(
                    "flink-jm container does not exist. Image build likely failed during 'podman-compose up'. " +
                    "Run: cd local-development-podman && podman-compose -f podman-compose.yml build flink-jobmanager && podman-compose -f podman-compose.yml up -d")
            }
            println "WARNING: Flink JobManager REST not responding but container exists — component tests requiring Flink will be skipped."
        }
        if (!kafkaConnectReady) {
            // Check if the container even exists — helps diagnose silent image build failures
            def containerExists = ['bash', '-c',
                'podman inspect kafka-connect >/dev/null 2>&1'].execute().waitFor() == 0
            if (!containerExists) {
                throw new GradleException(
                    "kafka-connect container does not exist. Image build likely failed during 'podman-compose up'. " +
                    "Run: cd local-development-podman && podman-compose -f podman-compose.yml up -d kafka-connect")
            }
            println "WARNING: Kafka Connect REST not responding but container exists — deploy-connectors.sh will retry."
        }
        if (!prometheusReady) println "WARNING: Prometheus metrics not ready — dashboards may be empty."
        if (!grafanaReady) println "WARNING: Grafana not ready — dashboard provisioning may be incomplete."

        // Provision Grafana datasource + dashboard + alert rules via Terraform
        // Requires: terraform CLI on PATH. Skipped with a warning if not found.
        println '=== Applying Terraform (Grafana datasource + dashboard + alerts) ==='
        boolean hasTerraform = false
        try {
            hasTerraform = ['bash', '-c', 'command -v terraform >/dev/null 2>&1'].execute().waitFor() == 0
        } catch (Exception ignored) { }

        if (!hasTerraform) {
            println "WARNING: terraform not found on PATH — skipping Grafana alert provisioning. Run 'cd local-development-podman/terraform && terraform init && terraform apply' manually."
        } else if (!grafanaReady) {
            println "WARNING: Grafana not healthy — skipping Terraform apply."
        } else {
            exec {
                commandLine 'bash', '-c', 'cd local-development-podman/terraform && terraform init -input=false && terraform apply -auto-approve -input=false'
            }
            println '✓ Terraform apply complete — Grafana datasource, dashboard and alert rules provisioned.'
        }

        // Build Kafka Connect SMTs with Gradle
        println '=== Building Kafka Connect SMTs ==='
        exec {
            commandLine './gradlew', ':kafka-connect-smts:shadowJar'
        }

        // Deploy Kafka Connect connectors
        // DB_HOST=mysql: on Podman bridge the Connect container reaches MySQL by service name.
        println '=== Deploying Kafka Connect connectors ==='
        exec {
            commandLine 'bash', '-c', 'cd local-development-podman/kafka-connect && DB_HOST=mysql ./deploy-connectors.sh'
        }

        // Run component tests (both Flink and Kafka Connect)
        println '=== Running component tests (Flink + Kafka Connect) ==='
        exec {
            commandLine './gradlew', ':component-tests:test'
        }
    }
}

