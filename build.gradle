buildscript {
    repositories {
        mavenCentral()
        maven { url = uri("https://plugins.gradle.org/m2") }
    }
    dependencies {
        classpath 'com.github.johnrengelman:shadow:8.1.1'
        classpath 'info.solidsoft.gradle.pitest:gradle-pitest-plugin:1.15.0'
    }
}

plugins {
    id 'com.diffplug.spotless' version '6.25.0'
}

// Shadow and pitest are applied per-subproject via apply plugin: '...'

ext {
    flinkVersion       = '2.2.0'
    flinkCdcVersion    = '3.6.0-2.2'
    flinkKafkaVersion  = '5.0.0-2.2'
    kafkaVersion       = '3.7.0'
    javaVersion        = '17'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'checkstyle'
    apply plugin: 'com.diffplug.spotless'

    java {
        sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaVersion)
        targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaVersion)
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly "org.apache.flink:flink-streaming-java:${rootProject.ext.flinkVersion}"
        compileOnly "org.apache.flink:flink-clients:${rootProject.ext.flinkVersion}"
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    }

    test {
        useJUnitPlatform()
    }

    checkstyle {
        toolVersion = '9.3'
        ignoreFailures = false
        showViolations = true
    }

    spotless {
        java {
            target 'src/**/*.java', '**/test/**/*.java'
            googleJavaFormat('1.21.0')
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    tasks.named('check').configure {
        dependsOn spotlessCheck
    }

    // Global resolution strategy for lz4-java conflict
    configurations.all {
        resolutionStrategy {
            force 'org.lz4:lz4-java:1.8.0'
            exclude group: 'at.yawk.lz4', module: 'lz4-java'
        }
    }
}

tasks.register('codeQuality') {
    group = 'analysis'
    description = 'Run Checkstyle code quality checks on all subprojects'
}

tasks.register('fmt') {
    group = 'formatting'
    description = 'Format all Java code with Spotless (Google Java Format)'
    dependsOn 'spotlessApply'
}

tasks.register('fmtCheck') {
    group = 'formatting'
    description = 'Check Java formatting without applying changes'
    dependsOn 'spotlessCheck'
}

tasks.register('all') { // buildAndTest
    group = 'flink-cdc-poc'
    description = 'Build all, restart the container stack (Podman), and run component tests'
    dependsOn ':common:spotlessApply', spotlessCheck

    doLast {
        // Determine container engine from gradle.properties (or auto-detect)
        String configEngine = project.findProperty('container.engine') ?: 'auto'
        String engine = configEngine

        if (engine == 'auto') {
            // Auto-detect: prefer Podman, fall back to Docker
            boolean hasPodman = false
            try {
                hasPodman = ['bash', '-c', 'command -v podman-compose >/dev/null 2>&1'].execute().waitFor() == 0
            } catch (Exception ignored) { }
            engine = hasPodman ? 'podman' : 'docker'
        }

        String composeUp   = engine == 'podman' ? 'podman-compose -f podman-compose.yml up -d --build'   : 'docker compose up -d --build'
        String composeDown = engine == 'podman' ? 'podman-compose -f podman-compose.yml down -v' : 'docker compose down -v --remove-orphans'
        println "=== Using container engine: ${engine} ==="

        // Build all modules, including the variant fat-jars the component tests submit
        exec {
            commandLine './gradlew', 'clean', 'build', '-x', 'test', 'shadowJar'
        }

        // Restart the container stack with improved diagnostics
        println "=== Stopping and cleaning ${engine} stack ==="
        exec {
            commandLine 'bash', '-c', "cd local-development && ${composeDown}"
            ignoreExitValue = true  // "container not found" on first run is not an error
        }

        println '=== Waiting 5 seconds before restart ==='
        Thread.sleep(5000)

        println "=== Starting ${engine} stack ==="
        exec {
            commandLine 'bash', '-c', "cd local-development && ${composeUp}"
        }

        // Wait for MySQL, Kafka, Kafka Connect, Flink, Prometheus, and Grafana to be ready.
        // Engine health status is unreliable under podman-compose, so probe services directly.
        // 180s timeout: Kafka Connect plugin scanning + Debezium download on first build
        // can take 90s+, especially on cold starts.
        println 'Waiting for services to start (up to 180 seconds)...'
        int maxWait = 180
        int elapsed = 0
        boolean mysqlKafkaReady = false
        boolean kafkaConnectReady = false
        boolean flinkReady = false
        boolean prometheusReady = false
        boolean grafanaReady = false
        while (elapsed < maxWait) {
            try {
                if (!mysqlKafkaReady) {
                    mysqlKafkaReady = ['bash', '-c',
                        "${engine} exec mysql mysqladmin ping -h localhost -u flink -pflink 2>/dev/null && " +
                        "${engine} exec kafka kafka-broker-api-versions --bootstrap-server localhost:9092 2>/dev/null"]
                        .execute().waitFor() == 0
                    if (mysqlKafkaReady) println "✓ MySQL and Kafka are ready!"
                }
                if (!kafkaConnectReady) {
                    kafkaConnectReady = ['bash', '-c', 'curl -sf http://localhost:8083 >/dev/null 2>&1']
                        .execute().waitFor() == 0
                    if (kafkaConnectReady) println "✓ Kafka Connect is ready!"
                }
                if (!flinkReady) {
                    flinkReady = ['bash', '-c', 'curl -sf http://localhost:8081/overview >/dev/null 2>&1']
                        .execute().waitFor() == 0
                    if (flinkReady) println "✓ Flink JobManager is ready!"
                }
                if (!prometheusReady) {
                    prometheusReady = ['bash', '-c', 'curl -sf http://localhost:9090/-/healthy >/dev/null 2>&1']
                        .execute().waitFor() == 0
                    if (prometheusReady) println "✓ Prometheus is ready!"
                }
                if (!grafanaReady) {
                    grafanaReady = ['bash', '-c', 'curl -sf http://localhost:3001/api/health >/dev/null 2>&1']
                        .execute().waitFor() == 0
                    if (grafanaReady) println "✓ Grafana is ready!"
                }
                if (mysqlKafkaReady && kafkaConnectReady && flinkReady && prometheusReady && grafanaReady) break
            } catch (Exception e) {
                // Continue waiting, services might still be starting
            }
            elapsed += 5
            if (elapsed < maxWait) {
                println "Waiting... (${elapsed}s elapsed, MySQL+Kafka=${mysqlKafkaReady}, KC=${kafkaConnectReady}, Flink=${flinkReady}, Prometheus=${prometheusReady}, Grafana=${grafanaReady})"
                Thread.sleep(5000)
            }
        }

        if (!mysqlKafkaReady) println "WARNING: MySQL/Kafka may not be fully ready. Proceeding anyway..."
        if (!flinkReady) {
            def flinkContainerExists = ['bash', '-c',
                "${engine} inspect flink-jm >/dev/null 2>&1"].execute().waitFor() == 0
            if (!flinkContainerExists) {
                throw new GradleException(
                    "flink-jm container does not exist. Image build likely failed during 'podman-compose up'. " +
                    "Run: cd local-development && podman-compose -f podman-compose.yml build flink-jobmanager && podman-compose -f podman-compose.yml up -d")
            }
            println "WARNING: Flink JobManager REST not responding but container exists — component tests requiring Flink will be skipped."
        }
        if (!kafkaConnectReady) {
            // Check if the container even exists — helps diagnose silent image build failures
            def containerExists = ['bash', '-c',
                "${engine} inspect kafka-connect >/dev/null 2>&1"].execute().waitFor() == 0
            if (!containerExists) {
                throw new GradleException(
                    "kafka-connect container does not exist. Image build likely failed during 'podman-compose up'. " +
                    "Run: cd local-development && podman-compose -f podman-compose.yml up -d kafka-connect")
            }
            println "WARNING: Kafka Connect REST not responding but container exists — deploy-connectors.sh will retry."
        }
        if (!prometheusReady) println "WARNING: Prometheus metrics not ready — dashboards may be empty."
        if (!grafanaReady) println "WARNING: Grafana not ready — dashboard provisioning may be incomplete."

        // Provision Grafana datasource + dashboard + alert rules via Terraform
        // Requires: terraform CLI on PATH. Skipped with a warning if not found.
        println '=== Applying Terraform (Grafana datasource + dashboard + alerts) ==='
        boolean hasTerraform = false
        try {
            hasTerraform = ['bash', '-c', 'command -v terraform >/dev/null 2>&1'].execute().waitFor() == 0
        } catch (Exception ignored) { }

        if (!hasTerraform) {
            println "WARNING: terraform not found on PATH — skipping Grafana alert provisioning. Run 'cd local-development/terraform && terraform init && terraform apply' manually."
        } else if (!grafanaReady) {
            println "WARNING: Grafana not healthy — skipping Terraform apply."
        } else {
            exec {
                commandLine 'bash', '-c', 'cd local-development/terraform && rm -f terraform.tfstate terraform.tfstate.backup && terraform init -input=false && terraform apply -auto-approve -input=false'
            }
            println '✓ Terraform apply complete — Grafana datasource, dashboard and alert rules provisioned.'
        }

        // Build Kafka Connect SMTs with Gradle
        println '=== Building Kafka Connect SMTs ==='
        exec {
            commandLine './gradlew', ':kafka-connect-smts:shadowJar'
        }

        // Deploy Kafka Connect connectors
        // DB_HOST=mysql: on Podman bridge, the Connect container reaches MySQL by service name;
        // on Docker host-network, localhost is correct (the script default).
        String dbHost = (engine == 'podman') ? 'mysql' : 'localhost'
        println '=== Deploying Kafka Connect connectors ==='
        exec {
            commandLine 'bash', '-c', "cd local-development/kafka-connect && DB_HOST=${dbHost} ./deploy-connectors.sh"
        }

        // Run component tests (both Flink and Kafka Connect)
        println '=== Running component tests (Flink + Kafka Connect) ==='
        exec {
            commandLine './gradlew', ':component-tests:test'
        }
    }
}

