// Kafka Connect custom Single Message Transformers (SMTs)
// Builds a JAR with EnrichmentTransform and OutboxRoutingTransform

apply plugin: 'java'
apply plugin: 'com.github.johnrengelman.shadow'

java {
    // cp-kafka-connect:7.6.1 ships JDK 11; compiling for 17 produces class files
    // that won't load in the container (UnsupportedClassVersionError 61.0 > 55.0).
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

group = 'poc.kafka.connect'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Kafka Connect API (provided by Kafka Connect runtime; also needed for tests)
    compileOnly libs.kafka.connect.api
    testImplementation libs.kafka.connect.api

    // JSON parsing
    implementation libs.json

    // Testing
    // The root subprojects{} block forces useJUnitPlatform() on every module, which
    // cannot discover JUnit 4 (@org.junit.Test) tests on its own. These SMT tests are
    // JUnit 4, so the vintage engine must be on the test runtime classpath or the
    // tests silently don't run (the build reports 0 tests, green, masking regressions).
    testImplementation libs.junit4
    testImplementation libs.junit.vintage.engine
}

jar {
    manifest {
        attributes(
            'Specification-Title': 'POC Kafka Connect SMTs',
            'Specification-Version': project.version,
            'Implementation-Title': 'poc.kafka.connect',
            'Implementation-Version': project.version
        )
    }
}

shadowJar {
    archiveClassifier = 'with-deps'
    zip64 = true

    // Exclude Kafka Connect API (provided by runtime)
    exclude 'org/apache/kafka/connect/**'
}
