// Component tests: two categories
//
// 1. INTEGRATION TESTS (require Podman stack)
//    Submit Flink fat-jars to the real JobManager container (localhost:8081)
//    via the Flink REST API and verify results via Kafka polling.
//    Examples: DataStreamCdcTest, TableApiCdcTest, etc.
//
// 2. LOCAL UNIT TESTS (fast, no containers needed)
//    Test CDC transformation logic in isolation without external services.
//    Run instantly during development for fast feedback.
//    Examples: DataStreamCdcMiniClusterTest, OutboxRouterMiniClusterTest
//
// Run with:
//   ./gradlew :component-tests:test                              # All tests
//   ./gradlew :component-tests:test --tests "poc.component.DataStreamCdcTest"  # Integration only
//   ./gradlew :component-tests:test --tests "*MiniClusterTest"   # Local tests only

dependencies {
    // Shared config / sink factory
    testImplementation project(':common')

    // MySQL driver for JDBC connectivity
    testImplementation libs.mysql.connector.j

    // Kafka client for polling test topics
    testImplementation(libs.kafka.clients) {
        exclude group: 'at.yawk.lz4', module: 'lz4-java'
    }
    testImplementation libs.lz4.java

    // Flink streaming API & testing (MiniCluster for in-process testing)
    testImplementation libs.flink.streaming.java
    testImplementation libs.flink.clients
    testImplementation libs.flink.test.utils

    // JSON parsing (Kafka Connect REST API + Flink REST response parsing)
    testImplementation libs.json

    // Test framework & logging
    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testImplementation libs.slf4j.simple
    testImplementation libs.lombok
    testAnnotationProcessor libs.lombok
}

test {
    useJUnitPlatform()

    // Flink tests upload these fat-jars to the JobManager — make sure they exist and are fresh
    dependsOn ':variant-flink-datastream-api-v1-cdc-job:shadowJar'
    dependsOn ':variant-flink-table-api-cdc-job:shadowJar'
    dependsOn ':variant-flink-sql-api-cdc-job:shadowJar'
    dependsOn ':variant-flink-datastream-api-v1-outbox-job:shadowJar'
    testLogging {
        events 'started', 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
        afterSuite { desc, result ->
            if (!desc.parent) {
                println("\n" + "="*70)
                println("Test Results: ${result.resultType} (${result.testCount} tests)")
                println("="*70)
            }
        }
    }
    enabled = true

    // Pass root project dir so FlinkTestBase can resolve fat-jar paths
    systemProperty 'rootProjectDir', rootProject.projectDir.absolutePath

    jvmArgs '-Xmx512m'
}
