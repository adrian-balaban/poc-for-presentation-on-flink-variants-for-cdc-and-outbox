org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=false
# Suppress Kerberos/delegation-token probing WARNs from Flink MiniCluster (no Hadoop in test env)
org.slf4j.simpleLogger.log.org.apache.flink.runtime.security.token=error
# Suppress web dashboard log-file WARN (log.file system property not set in test JVM)
org.slf4j.simpleLogger.log.org.apache.flink.runtime.webmonitor.WebMonitorUtils=error
