# FlinkDeployment for the SQL API CDC variant (variant-3) on k8s.
#
# Same init-container + volume artifact pattern as the DataStream variant — see
# flinkdeployment-datastream.yaml for the full pattern explanation and the
# v1beta1 schema notes. Only the per-variant specifics differ:
#
#   - artifact image:  flink-cdc-artifact-sql-api:latest
#   - jarURI:          local:///opt/flink/usrlib/sql-api-job.jar
#   - entryClass:      poc.sqlapi.SqlApiCdcJob
#   - server-id envs:  MYSQL_SQL_API_ORDERS_SERVER_ID    = 5800-5849
#                      MYSQL_SQL_API_CUSTOMERS_SERVER_ID = 5850-5899
#   - Kafka topics:    poc.cdc.sql-api.flink.orders  (KAFKA_TOPIC_PREFIX + ".sql-api.flink.orders")
#                      poc.cdc.sql-api.flink.customers
#
# The SQL API job declares two mysql-cdc sources (orders, customers) in SQL DDL
# with hardcoded table-names and a StatementSet that compiles both INSERTs into
# a single JobGraph (one checkpoint, one recovery unit). It reads TWO server-id
# ranges — one per source — both must be non-overlapping with every other
# variant. MYSQL_TABLES is set for uniformity but is NOT read by this variant.
---
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: sql-api-cdc
  namespace: poc
spec:
  image: flink-with-mysql:latest
  imagePullPolicy: Never
  flinkVersion: v2_2
  serviceAccount: flink
  flinkConfiguration:
    state.backend: rocksdb
    execution.checkpointing.dir: s3://flink-checkpoints/checkpoints
    execution.checkpointing.savepoint-dir: s3://flink-checkpoints/savepoints
    s3.endpoint: http://minio:9000
    s3.path.style.access: "true"
    s3.access-key: minioadmin
    s3.secret-key: minioadmin
    metrics.reporter.prom.class: org.apache.flink.metrics.prometheus.PrometheusReporter
  jobManager:
    replicas: 1
    resource:
      memory: 2Gi
      cpu: 1
    podTemplate:
      spec:
        initContainers:
          - name: fetch-job-jar
            image: flink-cdc-artifact-sql-api:latest
            imagePullPolicy: Never
            command:
              - sh
              - -c
              - "cp /artifacts/sql-api-job.jar /opt/flink/usrlib/sql-api-job.jar"
            volumeMounts:
              - mountPath: /opt/flink/usrlib
                name: flink-usrlib
  taskManager:
    replicas: 1
    resource:
      memory: 2Gi
      cpu: 1
  job:
    jarURI: local:///opt/flink/usrlib/sql-api-job.jar
    entryClass: poc.sqlapi.SqlApiCdcJob
    parallelism: 1
    state: running
    upgradeMode: last-state
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          volumeMounts:
            - mountPath: /opt/flink/usrlib
              name: flink-usrlib
          env:
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: flink
            - name: MYSQL_PASSWORD
              value: flink
            - name: MYSQL_DATABASE
              value: poc_db
            - name: MYSQL_TABLES
              value: poc_db.orders,poc_db.customers,poc_db.outbox_events
            - name: MYSQL_SQL_API_ORDERS_SERVER_ID
              value: 5800-5849
            - name: MYSQL_SQL_API_CUSTOMERS_SERVER_ID
              value: 5850-5899
            - name: KAFKA_BOOTSTRAP
              value: poc-kafka-kafka-bootstrap:9092
            - name: KAFKA_TOPIC_PREFIX
              value: poc.cdc
      volumes:
        - name: flink-usrlib
          emptyDir: {}