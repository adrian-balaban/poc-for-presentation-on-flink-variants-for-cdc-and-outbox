# MySQL 8.0 for the flink-cdc-poc k8s slice.
#
# Mirrors the Podman Compose `mysql` service exactly:
#  - image docker.io/library/mysql:8.0
#  - binlog ROW/FULL, server-id=1 (Flink CDC / Debezium source requirement)
#  - user flink/flink, db poc_db, init.sql creates orders/customers/outbox_events
# The binlog config is a ConfigMap mounted at /etc/mysql/conf.d/binlog.cnf;
# the schema is the same init.sql mounted at /docker-entrypoint-initdb.d/.
#
# Exposed only inside the cluster as `mysql:3306` (headless Service, the standard
# StatefulSet pattern). Host access for tests is via `kubectl port-forward`.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: poc
data:
  binlog.cnf: |
    [mysqld]
    log-bin=mysql-bin
    binlog-format=ROW
    binlog-row-image=FULL
    server-id=1
    expire_logs_days=30
  init.sql: |
    -- poc_db schema used by all 5 variants

    -- Grant binlog/CDC privileges to the flink user
    -- RELOAD is required by Debezium for FLUSH TABLES WITH READ LOCK during snapshot
    GRANT REPLICATION SLAVE, REPLICATION CLIENT, RELOAD ON *.* TO 'flink'@'%';
    GRANT SELECT, LOCK TABLES ON poc_db.* TO 'flink'@'%';
    FLUSH PRIVILEGES;

    CREATE DATABASE IF NOT EXISTS poc_db;
    USE poc_db;

    -- Used by: variant-1 (DataStream CDC), variant-2 (Table API), variant-3 (SQL API), variant-5 (YAML)
    CREATE TABLE orders (
        id          BIGINT      NOT NULL AUTO_INCREMENT,
        customer_id BIGINT      NOT NULL,
        amount      DECIMAL(10,2) NOT NULL,
        status      VARCHAR(1024),
        created_at  DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
        PRIMARY KEY (id)
    );

    -- Used by: variant-3 (SQL API — multi-table StatementSet demo)
    CREATE TABLE customers (
        id    BIGINT      NOT NULL AUTO_INCREMENT,
        name  VARCHAR(128) NOT NULL,
        email VARCHAR(256) NOT NULL,
        PRIMARY KEY (id)
    );

    -- Used by: variant-4 (Outbox)
    -- destination column drives per-row topic routing in OutboxRouter
    CREATE TABLE outbox_events (
        id          BIGINT       NOT NULL AUTO_INCREMENT,
        destination VARCHAR(128) NOT NULL,
        payload     JSON         NOT NULL,
        created_at  DATETIME(3)  NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
        PRIMARY KEY (id)
    );

    -- ── Seed data ──────────────────────────────────────────────────────────────

    INSERT INTO customers (name, email) VALUES
        ('Alice',   'alice@example.com'),
        ('Bob',     'bob@example.com'),
        ('Charlie', 'charlie@example.com');

    INSERT INTO orders (customer_id, amount, status) VALUES
        (1, 99.99,  'PENDING'),
        (2, 249.50, 'SHIPPED'),
        (3, 15.00, 'DELIVERED');

    INSERT INTO outbox_events (destination, payload) VALUES
        ('payments',      '{"order_id":1,"amount":99.99}'),
        ('notifications', '{"user_id":2,"message":"Order shipped"}'),
        ('audit',         '{"action":"CREATE","entity":"order","id":3}');
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: poc
spec:
  clusterIP: None           # headless — StatefulSet stable DNS (mysql-0.mysql)
  selector:
    app: mysql
  ports:
    - port: 3306
      name: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: poc
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: docker.io/library/mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_USER
              value: flink
            - name: MYSQL_PASSWORD
              value: flink
            - name: MYSQL_DATABASE
              value: poc_db
          volumeMounts:
            - name: mysql-config
              mountPath: /etc/mysql/conf.d/binlog.cnf
              subPath: binlog.cnf
            - name: mysql-config
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u flink -pflink"]
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: mysql-config
          configMap:
            name: mysql-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi