# Strimzi KafkaConnect cluster + 5 KafkaConnector CRs mirroring the 5 Podman
# Kafka Connect variants.
#
# APPROACH — KafkaConnect CR + KafkaConnector CRs (not REST API POST):
#   The `strimzi.io/use-connector-resources: "true"` annotation on the KafkaConnect
#   CR tells the Strimzi operator to reconcile connectors from KafkaConnector CRs
#   instead of (or in addition to) the REST API. Each KafkaConnector CR maps 1:1
#   to one connector instance. The operator POSTs/PATCHes the connector config to
#   the REST endpoint on our behalf — no deploy-connectors.sh needed in k8s.
#
# IMAGE — kafka-connect-debezium:local (built from k8s/kafka-connect/Dockerfile):
#   Derived from quay.io/strimzi/kafka:1.0.1-kafka-4.2.0 with Debezium 3.5.2.Final
#   (Kafka 4.x compatible — 3.0.x still used poll(long) removed in Kafka 4.0) +
#   our custom SMT JAR. Tag :local (not :latest) so
#   kubelet defaults to imagePullPolicy=IfNotPresent and uses the kind-loaded image
#   without a registry — same approach as the :local tag pattern.
#
# KEY DIFFERENCES vs Podman connector JSONs:
#   1. database.hostname: mysql    (in-cluster Service; was localhost in Podman)
#   2. schema.history.internal.kafka.bootstrap.servers: poc-kafka-kafka-bootstrap:9092
#      (Strimzi bootstrap; was kafka:29092 in Podman)
#   3. database.server.name omitted — removed in Debezium 3.x; topic.prefix is now
#      the sole config key for the logical server name.
#   4. key.converter / value.converter set at the worker level (KafkaConnect CR config)
#      rather than repeated per connector.
#
# SERVER-ID RANGES (non-overlapping, matching CLAUDE.md):
#   kc-datastream:     5510   kc-table-api: 5520   kc-sql-api: 5530
#   kc-yaml-pipeline:  5540   kc-outbox:    5550
#
# KAFKA TOPIC NAMES (matching Podman naming convention):
#   kc-datastream:    poc.kc.datastream.*
#   kc-table-api:     poc.kc.table-api.*
#   kc-sql-api:       poc.kc.sql-api.*
#   kc-yaml-pipeline: poc.kc.yaml-pipeline.*
#   kc-outbox:        poc.kc.outbox.<destination>  (dynamic via OutboxRoutingTransform)
#
# SCHEMA HISTORY TOPICS (one per connector — must be unique):
#   dbhistory.datastream / dbhistory.tableapi / dbhistory.sqlapi /
#   dbhistory.yaml / dbhistory.outbox
#
# Note on Kafka version compatibility: Strimzi 1.0.x runs Kafka 4.2.0; the Podman
# stack runs cp-kafka 7.6.1 (= Kafka 3.7.0). Debezium 3.x bridged to Kafka 4.x;
# no issues expected for basic CDC→Kafka path.
#
# ── 1. KafkaConnect cluster ──────────────────────────────────────────────────
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: poc-connect
  namespace: poc
  annotations:
    # Required: enables KafkaConnector CR reconciliation for this Connect cluster.
    strimzi.io/use-connector-resources: "true"
spec:
  replicas: 1
  bootstrapServers: poc-kafka-kafka-bootstrap:9092
  # Custom image (Strimzi base + Debezium 3.x + SMT). Tag :local → IfNotPresent
  # pull policy → uses kind-loaded image. Must be loaded via `kind load docker-image`.
  image: kafka-connect-debezium:local
  # Strimzi 1.0.x graduated KafkaConnect to v1: groupId and the three storage
  # topics are now REQUIRED top-level spec fields (in v1beta2 they lived under
  # spec.config.* and the v1 schema rejects them there). Moved up so `kubectl
  # apply` validates. The remaining worker config (converters, replication
  # factors) stays under spec.config.
  groupId: poc-connect
  offsetStorageTopic: connect-offsets
  configStorageTopic: connect-configs
  statusStorageTopic: connect-status
  config:
    # Single-broker Strimzi Kafka cluster — all replication factors must be 1.
    config.storage.replication.factor: "1"
    offset.storage.replication.factor: "1"
    status.storage.replication.factor: "1"
    # Default converters for all connectors (each connector can override).
    key.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: "false"
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: "false"

# ── 2. KafkaConnector — DataStream CDC (mirrors kc-datastream-cdc.json) ─────
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: kc-datastream-cdc
  namespace: poc
  labels:
    # Associates this connector with the poc-connect KafkaConnect cluster.
    strimzi.io/cluster: poc-connect
spec:
  class: io.debezium.connector.mysql.MySqlConnector
  tasksMax: 1
  config:
    database.hostname: mysql
    database.port: "3306"
    database.user: flink
    database.password: flink
    database.server.id: "5510"
    # topic.prefix is the Debezium 3.x replacement for database.server.name —
    # sets the logical server name used in schema history and topic routing.
    topic.prefix: poc.kc.datastream
    database.include.list: poc_db
    table.include.list: poc_db.orders,poc_db.customers,poc_db.outbox_events
    snapshot.mode: initial
    decimal.handling.mode: string
    include.schema.changes: "false"
    schema.history.internal.kafka.bootstrap.servers: poc-kafka-kafka-bootstrap:9092
    schema.history.internal.kafka.topic: dbhistory.datastream
    transforms: enrichment
    transforms.enrichment.type: poc.kafka.connect.EnrichmentTransform
    transforms.enrichment.variant.name: datastream-cdc
    transforms.enrichment.topic.prefix: poc.kc.datastream

