# ── 5. KafkaConnector — YAML Pipeline CDC (mirrors kc-yaml-pipeline-cdc.json) ─
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: kc-yaml-pipeline-cdc
  namespace: poc
  labels:
    strimzi.io/cluster: poc-connect
spec:
  class: io.debezium.connector.mysql.MySqlConnector
  tasksMax: 1
  config:
    database.hostname: mysql
    database.port: "3306"
    database.user: flink
    database.password: flink
    database.server.id: "5540"
    # Topic prefix poc.kc.yaml-pipeline — engine prefix (poc.kc vs poc.flink) avoids
    # collision with the Flink YAML Pipeline variant which writes to poc.flink.yaml-pipeline.orders.
    topic.prefix: poc.kc.yaml-pipeline
    database.include.list: poc_db
    table.include.list: poc_db.orders
    snapshot.mode: initial
    decimal.handling.mode: string
    include.schema.changes: "false"
    schema.history.internal.kafka.bootstrap.servers: poc-kafka-kafka-bootstrap:9092
    schema.history.internal.kafka.topic: dbhistory.yaml
    transforms: enrichment
    transforms.enrichment.type: poc.kafka.connect.EnrichmentTransform
    transforms.enrichment.variant.name: yaml-pipeline-cdc
    transforms.enrichment.topic.prefix: poc.kc.yaml-pipeline

# ── 6. KafkaConnector — Outbox CDC (mirrors kc-outbox-cdc.json) ─────────────
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: kc-outbox-cdc
  namespace: poc
  labels:
    strimzi.io/cluster: poc-connect
spec:
  class: io.debezium.connector.mysql.MySqlConnector
  tasksMax: 1
  config:
    database.hostname: mysql
    database.port: "3306"
    database.user: flink
    database.password: flink
    database.server.id: "5550"
    topic.prefix: poc.kc.outbox
    database.include.list: poc_db
    table.include.list: poc_db.outbox_events
    snapshot.mode: initial
    decimal.handling.mode: string
    include.schema.changes: "false"
    schema.history.internal.kafka.bootstrap.servers: poc-kafka-kafka-bootstrap:9092
    schema.history.internal.kafka.topic: dbhistory.outbox
    # OutboxRoutingTransform routes messages dynamically to topics based on the
    # `destination` field in outbox_events rows.
    transforms: routing
    transforms.routing.type: poc.kafka.connect.OutboxRoutingTransform
    transforms.routing.topic.prefix: poc.kc.outbox
    transforms.routing.destination.field: destination
