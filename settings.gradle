pluginManagement {
    repositories {
        maven { url = uri("${rootDir}/local-maven-repo") }
        maven { url = uri("https://plugins.gradle.org/m2") }
        mavenCentral()
    }
}

rootProject.name = 'flink-cdc-poc'

include 'common'
include 'variant-flink-datastream-api-v1-cdc-job'
include 'variant-flink-table-api-cdc-job'
include 'variant-flink-sql-api-cdc-job'
include 'variant-flink-datastream-api-v1-outbox-job'
include 'variant-flink-cdc-yaml-pipeline-cdc-job'
include 'component-tests'

// Kafka Connect SMTs
include 'kafka-connect-smts'
project(':kafka-connect-smts').projectDir = file('local-development/kafka-connect-smts')
