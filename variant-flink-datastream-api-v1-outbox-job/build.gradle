apply plugin: 'com.github.johnrengelman.shadow'
apply plugin: 'jacoco'
apply plugin: 'info.solidsoft.pitest'

dependencies {
    implementation project(':common')
    implementation libs.flink.sql.connector.mysql.cdc
    implementation libs.flink.connector.kafka
    compileOnly libs.flink.streaming.java
    compileOnly libs.flink.clients
    testImplementation libs.flink.streaming.java
    testImplementation libs.slf4j.simple
}

shadowJar {
    manifest { attributes 'Main-Class': 'poc.outbox.OutboxJob' }
    mergeServiceFiles()
}

jacocoTestReport {
    dependsOn test
    reports { xml.required = true; html.required = true }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            excludes = ['poc.outbox.OutboxJob', 'poc.outbox.*']
            limit { counter = 'LINE';   value = 'COVEREDRATIO'; minimum = 0.0 }
        }
    }
}
check.dependsOn jacocoTestCoverageVerification

pitest {
    junit5PluginVersion = libs.versions.pitestJunit5.get()
    // OutboxRouter lives in :common — point PIT at that module's main source set
    // so it can mutate the class while running this module's (more thorough) tests.
    mainSourceSets      = [project(':common').sourceSets.main]
    targetClasses       = ['poc.common.router.OutboxRouter']
    targetTests         = ['poc.outbox.*']
    mutationThreshold   = 100
    coverageThreshold   = 0
    outputFormats       = ['HTML', 'XML']
    timestampedReports  = false
}
