version: '3.8'

# Podman-compatible Compose file. Replace docker-compose.yml usage with:
#   podman-compose -f podman-compose.yml up -d
#   podman-compose -f podman-compose.yml down -v
#
# Key differences from docker-compose.yml:
# 1. network_mode: host → bridge network with explicit port mappings (more portable)
# 2. Volume flags :Z for rootless Podman compatibility
# 3. Service networking via container names on bridge (podman-managed DNS)

x-kafka-connect-env: &kafka-connect-defaults
  CONNECT_GROUP_ID: poc-connect-group
  CONNECT_CONFIG_STORAGE_TOPIC: poc-connect-config
  CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
  CONNECT_OFFSET_STORAGE_TOPIC: poc-connect-offset
  CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
  CONNECT_STATUS_STORAGE_TOPIC: poc-connect-status
  CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
  CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
  CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
  CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
  CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
  CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/usr/share/java/custom-smts

networks:
  poc-net:
    driver: bridge

services:

  mysql:
    image: docker.io/library/mysql:8.0
    container_name: mysql
    networks:
      - poc-net
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: flink
      MYSQL_PASSWORD: flink
      MYSQL_DATABASE: poc_db
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d:Z
    command:
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --server-id=1
      - --expire_logs_days=1
    healthcheck:
      test: mysqladmin ping -h localhost -u flink -pflink
      interval: 10s
      retries: 5

  kafka:
    image: docker.io/confluentinc/cp-kafka:7.6.1
    container_name: kafka
    networks:
      - poc-net
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dual listeners: bridge mode isolates containers, so we need separate
      # advertised addresses. EXTERNAL (localhost:9092) is for host clients
      # (component tests, kafka CLI); INTERNAL (kafka:29092) is for other
      # containers (submitter, kafka-ui). On host networking a single listener
      # works, but bridge requires this split or clients get an unreachable host.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 15s
      retries: 5

  flink-jobmanager:
    build:
      context: ./flink-with-mysql
    container_name: flink-jm
    networks:
      - poc-net
    ports:
      - "6123:6123"
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.numberOfTaskSlots: 5
        rest.bind-address: 0.0.0.0
        rest.port: 8081
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: curl -sf http://localhost:8081/overview
      interval: 10s
      retries: 10
      start_period: 30s

  flink-taskmanager:
    build:
      context: ./flink-with-mysql
    container_name: flink-tm
    networks:
      - poc-net
    ports:
      - "6124:6123"
      - "8082:8081"
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.numberOfTaskSlots: 5
    depends_on:
      - flink-jobmanager

  flink-cdc-submitter:
    build:
      context: ./flink-cdc-submitter
    container_name: flink-cdc-submitter
    networks:
      - poc-net
    volumes:
      - ../variant-flink-cdc-yaml-pipeline-cdc-job/src/main/resources/pipeline.yaml:/pipeline.yaml:ro,Z
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: flink
      MYSQL_PASSWORD: flink
      MYSQL_DATABASE: poc_db
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC_PREFIX: poc.cdc
      JOBMANAGER_HOST: flink-jobmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    restart: on-failure

  kafka-connect:
    build:
      context: ..
      dockerfile: local-development/kafka-connect/Dockerfile
    container_name: kafka-connect
    networks:
      - poc-net
    ports:
      - "8083:8083"
    environment:
      <<: *kafka-connect-defaults
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: curl -sf http://localhost:8083
      interval: 10s
      retries: 5

  kafka-ui:
    image: docker.io/provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks:
      - poc-net
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: poc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      SERVER_PORT: 8080
    depends_on:
      - kafka
