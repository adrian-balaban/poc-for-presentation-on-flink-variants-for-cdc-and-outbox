apply plugin: 'com.github.johnrengelman.shadow'
apply plugin: 'jacoco'
apply plugin: 'info.solidsoft.pitest'

dependencies {
    implementation project(':common')
    implementation libs.flink.sql.connector.mysql.cdc
    implementation libs.flink.connector.kafka
    compileOnly libs.flink.streaming.java
    compileOnly libs.flink.clients
    testImplementation libs.flink.streaming.java
    // CdcEventRouterTest asserts enriched output via org.json exact-field access (the
    // router re-serialises through org.json, so substring matching on the raw string is
    // brittle — number formatting like 50.00 → 50.0 breaks it). Common exposes org.json
    // only at implementation scope, so the variant test needs its own testImplementation.
    testImplementation libs.json
}

shadowJar {
    manifest { attributes 'Main-Class': 'poc.datastream.DataStreamCdcJob' }
    mergeServiceFiles()
}

jacocoTestReport {
    dependsOn test
    reports { xml.required = true; html.required = true }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            element = 'CLASS'
            excludes = ['poc.datastream.DataStreamCdcJob']
            limit { counter = 'LINE';   value = 'COVEREDRATIO'; minimum = 1.0 }
            limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = 1.0 }
        }
    }
}
check.dependsOn jacocoTestCoverageVerification

pitest {
    junit5PluginVersion = libs.versions.pitestJunit5.get()
    // CdcEventRouter lives in :common — point PIT at that module's main source set
    // so it can mutate the class while running this module's (more thorough) tests.
    mainSourceSets      = [project(':common').sourceSets.main]
    targetClasses       = ['poc.common.router.CdcEventRouter']
    targetTests         = ['poc.datastream.*']
    mutationThreshold   = 100
    coverageThreshold   = 0
    outputFormats       = ['HTML', 'XML']
    timestampedReports  = false
}
